name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No DATABASE_URL is set, so settings fall back to SQLite — no secrets
      # needed for CI.
      - name: Django system check
        run: python src/manage.py check

      - name: Check for missing migrations
        run: python src/manage.py makemigrations --check --dry-run

      # Pass app labels explicitly: src/ is not a package, so bare
      # `test` auto-discovery from the repo root finds nothing.
      - name: Run tests
        run: python src/manage.py test core
